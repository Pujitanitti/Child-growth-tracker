<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password · Child Growth Tracker</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/utilities.css">
<link rel="stylesheet" href="../css/pages/login.css">
<script>
  (function () {
    var saved = localStorage.getItem('cgt_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
  <div class="auth-shell">
    <section class="auth-shell__panel">
      <div class="auth-shell__panel-content">
        <div class="flex items-center gap-3 mb-6">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="20" cy="20" r="19" fill="rgba(255,255,255,0.15)"/>
            <path d="M6 26 L14 18 L19 23 L26 12 L34 20" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <span style="font-family:var(--font-display); font-weight:600; font-size:1.25rem; color:#fff;">GrowthTracker</span>
        </div>
        <h1 class="auth-shell__panel-title">Forgot your password?</h1>
        <p class="auth-shell__panel-text">No problem — we'll send you a secure link to reset it in a few minutes.</p>
      </div>
    </section>

    <section class="auth-shell__form">
      <div class="auth-card animate-fade-in-up">
        <h2 class="auth-card__title">Reset your password</h2>
        <p class="auth-card__subtitle">Enter your account email and we'll send a reset link.</p>

        <form id="forgotForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address<span class="required">*</span></label>
            <input class="input" type="email" id="email" autocomplete="email" required>
            <div class="form-error hidden" id="err-email"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Send Reset Link</button>
        </form>

        <div id="successState" class="card mt-5 hidden" style="border-left:4px solid var(--color-success); background:var(--color-success-soft);">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-circle-check text-success"></i>
            <span class="text-sm">If that email is registered, a reset link is on its way. Check your inbox.</span>
          </div>
        </div>

        <p class="auth-card__footer"><a href="/pages/login.html"><i class="fa-solid fa-arrow-left"></i> Back to log in</a></p>
      </div>
    </section>
  </div>

  <script type="module">
    import { forgotPassword } from '../js/auth.js';
    import { validateForm, rules } from '../js/validators.js';

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errors = validateForm({ email }, { email: [rules.email] });
      document.getElementById('err-email').classList.add('hidden');
      if (errors.email) {
        const el = document.getElementById('err-email');
        el.textContent = errors.email; el.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        await forgotPassword(email);
      } finally {
        document.getElementById('forgotForm').classList.add('hidden');
        document.getElementById('successState').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
