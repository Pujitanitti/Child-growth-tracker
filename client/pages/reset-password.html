<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · Child Growth Tracker</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/utilities.css">
<link rel="stylesheet" href="../css/pages/login.css">
<script>
  (function () {
    var saved = localStorage.getItem('cgt_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
  <div class="auth-shell">
    <section class="auth-shell__panel">
      <div class="auth-shell__panel-content">
        <div class="flex items-center gap-3 mb-6">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="20" cy="20" r="19" fill="rgba(255,255,255,0.15)"/>
            <path d="M6 26 L14 18 L19 23 L26 12 L34 20" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <span style="font-family:var(--font-display); font-weight:600; font-size:1.25rem; color:#fff;">GrowthTracker</span>
        </div>
        <h1 class="auth-shell__panel-title">Almost there.</h1>
        <p class="auth-shell__panel-text">Choose a new password to get back into your account.</p>
      </div>
    </section>

    <section class="auth-shell__form">
      <div class="auth-card animate-fade-in-up">
        <h2 class="auth-card__title">Set a new password</h2>
        <p class="auth-card__subtitle">This link expires 15 minutes after it was requested.</p>

        <form id="resetForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="password">New password<span class="required">*</span></label>
            <input class="input" type="password" id="password" autocomplete="new-password" required>
            <div class="password-strength" id="strengthMeter">
              <div class="password-strength__bar"></div><div class="password-strength__bar"></div><div class="password-strength__bar"></div>
            </div>
            <div class="form-error hidden" id="err-password"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm">Confirm new password<span class="required">*</span></label>
            <input class="input" type="password" id="confirm" autocomplete="new-password" required>
            <div class="form-error hidden" id="err-confirm"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Reset Password</button>
        </form>

        <p class="auth-card__footer"><a href="/pages/login.html"><i class="fa-solid fa-arrow-left"></i> Back to log in</a></p>
      </div>
    </section>
  </div>

  <script type="module">
    import { resetPassword } from '../js/auth.js';
    import { showToast } from '../js/components/toast.js';
    import { validateForm, rules } from '../js/validators.js';
    import { wirePasswordStrengthMeter } from '../js/profile.js';

    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) showToast('This reset link is missing or invalid.', 'error', { duration: 0 });

    wirePasswordStrengthMeter(document.getElementById('password'), document.getElementById('strengthMeter'));

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      const errors = validateForm({ password, confirm }, {
        password: [rules.password],
        confirm: [rules.matches(password, 'Passwords')],
      });
      document.querySelectorAll('.form-error').forEach((el) => el.classList.add('hidden'));
      if (Object.keys(errors).length) {
        Object.entries(errors).forEach(([field, msg]) => {
          const el = document.getElementById(`err-${field}`);
          el.textContent = msg; el.classList.remove('hidden');
        });
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        await resetPassword(token, password);
        showToast('Password reset. You can now log in.', 'success');
        setTimeout(() => { window.location.href = '/pages/login.html'; }, 1200);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
