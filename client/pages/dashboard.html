<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Child Growth Tracker</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/utilities.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/pages/dashboard.css">
<script>
  (function () {
    var saved = localStorage.getItem('cgt_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <div>
      <div id="topbar-root"></div>

      <main class="main-content" id="mainContent">
        <div class="breadcrumbs"><a href="/pages/dashboard.html">Home</a> <span class="breadcrumbs__sep">/</span> <span>Dashboard</span></div>

        <div class="dashboard-hero animate-fade-in">
          <h1 class="dashboard-hero__title" id="heroGreeting">Welcome back</h1>
          <p class="dashboard-hero__subtitle">Here's how your family's growth journey is going.</p>
          <svg class="dashboard-hero__curve" viewBox="0 0 260 140" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M0 120 Q50 90 80 100 T160 50 T260 10" stroke="#fff" stroke-width="3" fill="none"/>
          </svg>
        </div>

        <div class="grid grid-cols-4 mb-6" id="statCards">
          <div class="card stat-card"><div class="skeleton" style="width:44px;height:44px;border-radius:12px;"></div><div class="skeleton mt-3" style="width:60%;height:24px;"></div><div class="skeleton mt-2" style="width:40%;height:14px;"></div></div>
          <div class="card stat-card"><div class="skeleton" style="width:44px;height:44px;border-radius:12px;"></div><div class="skeleton mt-3" style="width:60%;height:24px;"></div><div class="skeleton mt-2" style="width:40%;height:14px;"></div></div>
          <div class="card stat-card"><div class="skeleton" style="width:44px;height:44px;border-radius:12px;"></div><div class="skeleton mt-3" style="width:60%;height:24px;"></div><div class="skeleton mt-2" style="width:40%;height:14px;"></div></div>
          <div class="card stat-card"><div class="skeleton" style="width:44px;height:44px;border-radius:12px;"></div><div class="skeleton mt-3" style="width:60%;height:24px;"></div><div class="skeleton mt-2" style="width:40%;height:14px;"></div></div>
        </div>

        <div class="dashboard-grid">
          <div class="dashboard-grid__main">
            <section>
              <div class="flex items-center justify-between mb-3">
                <h2>Your Children</h2>
                <a href="/pages/children.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-plus"></i> Add Child</a>
              </div>
              <div class="grid grid-cols-3" id="childSummaries"></div>
            </section>

            <section class="card" data-widget-id="recent-activity">
              <div class="chart-card__header">
                <h3>Recent Activity</h3>
              </div>
              <div class="activity-feed" id="activityFeed"></div>
            </section>
          </div>

          <div class="dashboard-grid__side" id="dashboardSideWidgets">
            <section class="card" id="notifications" data-widget-id="vaccinations">
              <div class="chart-card__header">
                <h3>Upcoming Vaccinations</h3>
                <a href="/pages/children.html" class="text-sm">View all</a>
              </div>
              <div id="upcomingVaccinations"></div>
            </section>

            <section class="card" data-widget-id="reminders">
              <h3 class="mb-3">Today's Reminders</h3>
              <div id="todaysReminders" class="activity-feed"></div>
            </section>

            <section class="card" data-widget-id="appointments">
              <div class="chart-card__header">
                <h3><i class="fa-solid fa-calendar-check text-primary"></i> Upcoming Appointments</h3>
              </div>
              <div id="upcomingAppointments" class="activity-feed"></div>
            </section>

            <section class="card" data-widget-id="medicines">
              <div class="chart-card__header">
                <h3><i class="fa-solid fa-pills text-primary"></i> Active Medicines</h3>
              </div>
              <div id="activeMedicines" class="activity-feed"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script type="module">
    import { initApp } from '../js/app.js';
    import { fetchDashboardSummary, renderStatCards, renderChildSummaries, renderActivityFeed, renderUpcomingVaccinations } from '../js/dashboard.js';
    import { showToast } from '../js/components/toast.js';
    import { renderEmptyState } from '../js/components/loader.js';
    import { initDragReorder } from '../js/components/dragReorder.js';

    const user = await initApp('dashboard');
    if (user) {
      document.getElementById('heroGreeting').textContent = `Welcome back, ${user.name.split(' ')[0]}`;

      try {
        const summary = await fetchDashboardSummary();
        renderStatCards(document.getElementById('statCards'), summary);
        renderChildSummaries(document.getElementById('childSummaries'), summary.childSummaries);
        renderActivityFeed(document.getElementById('activityFeed'), summary.recentActivity);
        renderUpcomingVaccinations(document.getElementById('upcomingVaccinations'), summary.upcomingVaccinations);

        const remindersEl = document.getElementById('todaysReminders');
        if (summary.todaysReminders.length === 0) {
          remindersEl.innerHTML = '<p class="text-sm text-muted">No reminders for today. 🎉</p>';
        } else {
          const { notificationItemHtml } = await import('../js/notifications.js');
          remindersEl.innerHTML = summary.todaysReminders.map(notificationItemHtml).join('');
        }

        const apptEl = document.getElementById('upcomingAppointments');
        apptEl.innerHTML = summary.upcomingAppointments.length
          ? summary.upcomingAppointments.map((a) => `
              <div class="activity-item">
                <div class="activity-item__icon"><i class="fa-solid fa-calendar-check"></i></div>
                <div>
                  <div class="activity-item__title">${a.title} — ${a.child?.name || ''}</div>
                  <div class="activity-item__meta">${new Date(a.dateTime).toLocaleString()}</div>
                </div>
              </div>
            `).join('')
          : '<p class="text-sm text-muted">No appointments scheduled in the next 30 days.</p>';

        const medEl = document.getElementById('activeMedicines');
        medEl.innerHTML = summary.activeMedicines.length
          ? summary.activeMedicines.map((m) => `
              <div class="activity-item">
                <div class="activity-item__icon"><i class="fa-solid fa-pills"></i></div>
                <div>
                  <div class="activity-item__title">${m.medicineName} — ${m.child?.name || ''}</div>
                  <div class="activity-item__meta">${m.dosage || ''} · ${m.frequency}</div>
                </div>
              </div>
            `).join('')
          : '<p class="text-sm text-muted">No active medicine reminders.</p>';
      } catch (err) {
        showToast(err.message || 'Could not load dashboard data', 'error');
      }

      initDragReorder(document.getElementById('dashboardSideWidgets'), 'cgt_dashboard_widget_order');
    }
  </script>
</body>
</html>
