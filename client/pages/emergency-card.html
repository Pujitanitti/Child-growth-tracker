<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Health Card · Child Growth Tracker</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/utilities.css">
<script>
  (function () {
    var saved = localStorage.getItem('cgt_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  .id-card {
    max-width: 460px;
    margin: 0 auto;
    background: linear-gradient(160deg, var(--color-primary-dark), var(--color-primary));
    border-radius: var(--radius-xl);
    padding: var(--space-6);
    color: #fff;
    box-shadow: var(--shadow-lg);
  }
  .id-card__header { display:flex; align-items:center; gap:var(--space-4); margin-bottom: var(--space-5); }
  .id-card__photo { width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid rgba(255,255,255,0.5); }
  .id-card__row { display:flex; justify-content:space-between; padding:var(--space-2) 0; border-bottom:1px solid rgba(255,255,255,0.15); font-size:var(--fs-sm); }
  .id-card__row:last-child { border-bottom:none; }
  .id-card__label { color:rgba(255,255,255,0.7); }
  .id-card__value { font-weight:600; text-align:right; }
  .id-card__section-title { font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:0.06em; color:rgba(255,255,255,0.65); margin: var(--space-4) 0 var(--space-1); }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .id-card { box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="app-shell no-print">
    <div id="sidebar-root"></div>
    <div>
      <div id="topbar-root"></div>

      <main class="main-content">
        <div class="breadcrumbs no-print"><a href="/pages/dashboard.html">Home</a> <span class="breadcrumbs__sep">/</span> <a href="/pages/children.html">Children</a> <span class="breadcrumbs__sep">/</span> <span>Emergency Health Card</span></div>

        <div class="page-header no-print">
          <div>
            <h1 class="page-header__title"><i class="fa-solid fa-id-card text-primary"></i> Emergency Health Card</h1>
            <p class="page-header__subtitle">A quick-reference card with critical info — print it or save it to your phone.</p>
          </div>
          <div class="flex gap-2 flex-wrap">
            <select class="select" id="childSelect" style="max-width:200px;"></select>
            <button class="btn btn-secondary" id="printBtn"><i class="fa-solid fa-print"></i> Print</button>
            <button class="btn btn-secondary" id="downloadPdfBtn"><i class="fa-solid fa-download"></i> Download PDF</button>
            <button class="btn btn-secondary" id="shareBtn"><i class="fa-solid fa-share-nodes"></i> Share</button>
          </div>
        </div>

        <div id="cardContainer"></div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initApp } from '../js/app.js';
    import { fetchChildren } from '../js/children.js';
    import { formatAge, formatDate, resolveUploadUrl, initials } from '../js/utils.js';
    import { api } from '../js/api.js';
    import { showToast } from '../js/components/toast.js';

    const user = await initApp('emergency');
    if (!user) throw new Error('unauthenticated');

    const { children } = await fetchChildren();
    const select = document.getElementById('childSelect');

    // Keep the QR payload minimal (name + blood group + emergency phone only) —
    // it's generated via a third-party QR image API, so we deliberately don't
    // send allergies/conditions/doctor details through that request.
    function qrPayload(child) {
      return `${child.name} | Blood: ${child.bloodGroup} | Emergency: ${child.emergencyContact?.phone || 'N/A'}`;
    }

    if (!children.length) {
      document.getElementById('cardContainer').innerHTML = '<p class="text-muted text-center mt-6">Add a child first to generate their health card.</p>';
      select.disabled = true;
    } else {
      select.innerHTML = children.map((c) => `<option value="${c._id}">${c.name}</option>`).join('');
      const hashId = window.location.hash.replace('#', '');
      if (hashId && children.some((c) => c._id === hashId)) select.value = hashId;
      select.addEventListener('change', renderCard);
      renderCard();
    }

    function renderCard() {
      const child = children.find((c) => c._id === select.value);
      if (!child) return;

      document.getElementById('cardContainer').innerHTML = `
        <div class="id-card animate-scale-in">
          <div class="id-card__header">
            ${child.photo
              ? `<img src="${resolveUploadUrl(child.photo)}" class="id-card__photo" alt="${child.name}">`
              : `<div class="avatar avatar-lg id-card__photo" style="background:rgba(255,255,255,0.2); color:#fff;">${initials(child.name)}</div>`}
            <div>
              <div style="font-family:var(--font-display); font-weight:700; font-size:var(--fs-lg);">${child.name}</div>
              <div style="opacity:0.85; font-size:var(--fs-sm);">${formatAge(child.dateOfBirth)} old · ${child.gender}</div>
            </div>
          </div>

          <div class="id-card__section-title">Vital Info</div>
          <div class="id-card__row"><span class="id-card__label">Date of birth</span><span class="id-card__value">${formatDate(child.dateOfBirth)}</span></div>
          <div class="id-card__row"><span class="id-card__label">Blood group</span><span class="id-card__value">${child.bloodGroup}</span></div>

          <div class="id-card__section-title">Allergies</div>
          <div class="id-card__row"><span class="id-card__value" style="text-align:left;">${child.allergies?.length ? child.allergies.join(', ') : 'None recorded'}</span></div>

          <div class="id-card__section-title">Medical Conditions</div>
          <div class="id-card__row"><span class="id-card__value" style="text-align:left;">${child.medicalConditions?.length ? child.medicalConditions.join(', ') : 'None recorded'}</span></div>

          <div class="id-card__section-title">Emergency Contact</div>
          <div class="id-card__row"><span class="id-card__label">Name</span><span class="id-card__value">${child.emergencyContact?.name || 'Not set'}</span></div>
          <div class="id-card__row"><span class="id-card__label">Phone</span><span class="id-card__value">${child.emergencyContact?.phone || 'Not set'}</span></div>

          <div class="id-card__section-title">Doctor</div>
          <div class="id-card__row"><span class="id-card__label">Name</span><span class="id-card__value">${child.doctor?.name || 'Not set'}</span></div>
          <div class="id-card__row"><span class="id-card__label">Phone</span><span class="id-card__value">${child.doctor?.phone || 'Not set'}</span></div>

          <div class="flex justify-center mt-5">
            <div style="background:#fff; padding:10px; border-radius:12px;">
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(qrPayload(child))}" alt="QR code with this card's key info" width="120" height="120">
            </div>
          </div>
          <p class="text-center mt-2" style="font-size:var(--fs-xs); opacity:0.75;">Scan for a quick-reference summary</p>
        </div>
      `;
    }

    document.getElementById('printBtn').addEventListener('click', () => window.print());

    document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
      const child = children.find((c) => c._id === select.value);
      if (!child) return;
      const btn = document.getElementById('downloadPdfBtn');
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        await api.download(`/children/${child._id}/reports/emergency-card`, `${child.name}-emergency-card.pdf`);
      } catch (err) {
        showToast(err.message || 'Could not generate PDF', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const child = children.find((c) => c._id === select.value);
      if (!child) return;
      const shareUrl = `${window.location.origin}/pages/emergency-card.html#${child._id}`;
      const shareText = `${child.name}'s Emergency Health Card — Blood: ${child.bloodGroup}`;

      if (navigator.share) {
        try {
          await navigator.share({ title: 'Emergency Health Card', text: shareText, url: shareUrl });
        } catch {
          // user cancelled the share sheet — nothing to do
        }
      } else {
        await navigator.clipboard.writeText(shareUrl);
        showToast('Link copied to clipboard (sharing requires the recipient to also be logged into your account)', 'info');
      }
    });
  </script>
</body>
</html>
