name: 🐛 Bug Report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please don't use this form for security vulnerabilities — see [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What did you click/do, in order?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - Frontend (UI/UX)
        - Backend / API
        - Database / data integrity
        - Auth
        - Reports (PDF/CSV)
        - AI Assistant / Insights
        - Admin Panel
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: Windows 11
        - Browser: Chrome 128
        - Node version: v20.x
        - Local or deployed?
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / console errors
      description: Drag and drop images, or paste any browser console / server log output.
    validations:
      required: false
